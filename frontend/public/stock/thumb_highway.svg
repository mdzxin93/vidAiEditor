<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="120" fill="#7dd3fc"/>
  <!-- Ocean -->
  <rect y="100" width="400" height="150" fill="url(#ocean)"/>
  <!-- Coastal Mountain Cliffs -->
  <path d="M0,100 Q120,60 190,130 Q280,70 400,110 L400,250 L0,250 Z" fill="#78350f" opacity="0.8"/>
  <path d="M0,130 Q90,100 160,160 Q260,110 400,150 L400,250 L0,250 Z" fill="#15803d"/>
  <!-- Winding Asphalt Highway -->
  <path d="M0,230 Q120,180 180,200 Q260,220 400,180" stroke="#334155" stroke-width="28" fill="none"/>
  <!-- Road Yellow Centerline -->
  <path d="M0,230 Q120,180 180,200 Q260,220 400,180" stroke="#facc15" stroke-width="2" stroke-dasharray="10,8" fill="none"/>
</svg>