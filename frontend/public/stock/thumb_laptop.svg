<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="#e2e8f0"/>
  <!-- Warm background wall -->
  <rect width="400" height="110" fill="#cbd5e1"/>
  <!-- Wooden Desk -->
  <rect y="110" width="400" height="140" fill="url(#desk)"/>
  <!-- Coffee Cup -->
  <rect x="290" y="130" width="36" height="42" rx="4" fill="#ffffff"/>
  <path d="M326,140 Q338,145 326,160" stroke="#ffffff" stroke-width="4" fill="none"/>
  <!-- Laptop Screen -->
  <rect x="110" y="55" width="180" height="115" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
  <rect x="118" y="63" width="164" height="99" rx="3" fill="url(#screen)"/>
  <!-- Screen Code lines -->
  <rect x="128" y="75" width="60" height="4" rx="2" fill="#38bdf8"/>
  <rect x="128" y="85" width="90" height="4" rx="2" fill="#a3e635"/>
  <rect x="138" y="95" width="70" height="4" rx="2" fill="#f43f5e"/>
  <rect x="138" y="105" width="110" height="4" rx="2" fill="#94a3b8"/>
  <rect x="128" y="115" width="80" height="4" rx="2" fill="#fbbf24"/>
  <!-- Laptop Base -->
  <polygon points="90,170 310,170 295,178 105,178" fill="#94a3b8"/>
  <rect x="175" y="172" width="50" height="3" rx="1.5" fill="#64748b"/>
</svg>