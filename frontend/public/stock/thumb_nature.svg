<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="mnt1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mnt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#sky)"/>
  <!-- Distant Mountains -->
  <polygon points="40,160 130,50 210,160" fill="url(#mnt1)"/>
  <polygon points="120,50 130,50 160,110 135,115 130,95 125,110" fill="#ffffff"/>
  <polygon points="170,160 260,35 360,160" fill="url(#mnt2)"/>
  <polygon points="250,35 260,35 295,100 270,105 260,85 250,100" fill="#ffffff"/>
  <polygon points="0,160 70,80 150,160" fill="url(#mnt1)" opacity="0.85"/>
  <polygon points="290,160 350,75 400,160" fill="url(#mnt1)" opacity="0.9"/>
  <!-- Trees shoreline -->
  <rect x="0" y="152" width="400" height="12" fill="#064e3b" opacity="0.7"/>
  <!-- Lake -->
  <rect y="160" width="400" height="90" fill="url(#lake)"/>
  <!-- Water Reflections -->
  <ellipse cx="260" cy="185" rx="50" ry="6" fill="#38bdf8" opacity="0.3"/>
  <ellipse cx="140" cy="195" rx="40" ry="5" fill="#38bdf8" opacity="0.25"/>
</svg>