  <polygon points="120,0 280,0 350,250 190,250" fill="#fef9c3" opacity="0.4"/>
  <!-- Ceramic Pot -->
  <polygon points="170,170 230,170 220,230 180,230" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <ellipse cx="200" cy="170" rx="30" ry="7" fill="#cbd5e1"/>
  <!-- Leaves (Monstera style) -->
  <path d="M200,170 Q160,110 120,120 Q150,150 200,170" fill="#15803d"/>
  <path d="M200,170 Q190,80 160,60 Q180,110 200,170" fill="#16a34a"/>
  <path d="M200,170 Q210,60 225,40 Q230,100 200,170" fill="#22c55e"/>
