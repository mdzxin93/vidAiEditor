<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="100%" height="100%">
  <defs>
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="800" fill="url(#codeBg)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="540" height="54" fill="#1b1e24"/>
  <circle cx="36" cy="27" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="27" r="7" fill="#ffbd2e"/>
  <circle cx="80" cy="27" r="7" fill="#27c93f"/>
  <text x="270" y="34" text-anchor="middle" font-family="'Outfit', 'Inter', monospace" font-size="16" font-weight="500" fill="#8b949e">
    architecture/mern-stack.ts
  </text>

  <!-- Code Line Numbers & Syntax Highlighting -->
  <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" font-weight="600" xml:space="preserve">
    <!-- Line 1 -->
    <text x="30" y="110" fill="#484f58">01</text>
    <text x="75" y="110" fill="#ff7b72">import</text>
    <text x="145" y="110" fill="#e5ff00">{</text>
    <text x="165" y="110" fill="#79c0ff"> React, useState </text>
    <text x="345" y="110" fill="#e5ff00">}</text>
    <text x="365" y="110" fill="#ff7b72">from</text>
    <text x="415" y="110" fill="#a5d6ff">'react'</text>

    <!-- Line 2 -->
    <text x="30" y="150" fill="#484f58">02</text>
    <text x="75" y="150" fill="#ff7b72">import</text>
    <text x="145" y="150" fill="#79c0ff"> express </text>
    <text x="235" y="150" fill="#ff7b72">from</text>
    <text x="285" y="150" fill="#a5d6ff">'express'</text>

    <!-- Line 3 -->
    <text x="30" y="190" fill="#484f58">03</text>
    <text x="75" y="190" fill="#8b949e">// Production full-stack MERN core</text>

    <!-- Line 4 -->
    <text x="30" y="230" fill="#484f58">04</text>
    <text x="75" y="230" fill="#ff7b72">export</text>
    <text x="145" y="230" fill="#ff7b72">const</text>
    <text x="205" y="230" fill="#d2a8ff">Engine</text>
    <text x="275" y="230" fill="#ff7b72">=</text>
    <text x="295" y="230" fill="#e5ff00">async</text>
    <text x="355" y="230" fill="#e5ff00">()</text>
    <text x="385" y="230" fill="#ff7b72">=&gt;</text>
    <text x="415" y="230" fill="#e5ff00">{</text>

    <!-- Line 5 -->
    <text x="30" y="270" fill="#484f58">05</text>
    <text x="105" y="270" fill="#ff7b72">const</text>
    <text x="165" y="270" fill="#79c0ff">app</text>
    <text x="205" y="270" fill="#ff7b72">=</text>
    <text x="225" y="270" fill="#d2a8ff">express</text>
    <text x="295" y="270" fill="#ffffff">()</text>

    <!-- Line 6 -->
    <text x="30" y="310" fill="#484f58">06</text>
    <text x="105" y="310" fill="#ff7b72">await</text>
    <text x="165" y="310" fill="#79c0ff">Database</text>
    <text x="245" y="310" fill="#ffffff">.</text>
    <text x="255" y="310" fill="#d2a8ff">connect</text>
    <text x="325" y="310" fill="#ffffff">()</text>

    <!-- Line 7 -->
    <text x="30" y="350" fill="#484f58">07</text>
    <text x="105" y="350" fill="#ff7b72">return</text>
    <text x="175" y="350" fill="#79c0ff">System</text>
    <text x="235" y="350" fill="#ffffff">.</text>
    <text x="245" y="350" fill="#d2a8ff">scale</text>
    <text x="295" y="350" fill="#ffffff">({</text>
    <text x="320" y="350" fill="#79c0ff">speed:</text>
    <text x="385" y="350" fill="#a5d6ff">'10x'</text>
    <text x="430" y="350" fill="#ffffff">})</text>

    <!-- Line 8 -->
    <text x="30" y="390" fill="#484f58">08</text>
    <text x="75" y="390" fill="#e5ff00">}</text>
  </g>

  <!-- Glowing Badges in bottom half -->
  <g transform="translate(45, 460)">
    <!-- React Badge -->
    <g transform="translate(0, 0)">
      <rect width="135" height="135" rx="30" fill="#1e2229" stroke="#38404a" stroke-width="2.5"/>
      <ellipse cx="67" cy="67" rx="42" ry="16" fill="none" stroke="#61dafb" stroke-width="4" transform="rotate(30 67 67)"/>
      <ellipse cx="67" cy="67" rx="42" ry="16" fill="none" stroke="#61dafb" stroke-width="4" transform="rotate(90 67 67)"/>
      <ellipse cx="67" cy="67" rx="42" ry="16" fill="none" stroke="#61dafb" stroke-width="4" transform="rotate(150 67 67)"/>
      <circle cx="67" cy="67" r="7" fill="#61dafb"/>
      <text x="67" y="160" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#ffffff">REACT</text>
    </g>

    <!-- JS 3D Cube -->
    <g transform="translate(155, -20)">
      <polygon points="70,12 125,44 70,76 15,44" fill="#ffffff" stroke="#16181d" stroke-width="3"/>
      <polygon points="15,44 70,76 70,150 15,118" fill="#f4f4f4" stroke="#16181d" stroke-width="3"/>
      <polygon points="70,76 125,44 125,118 70,150" fill="#e2e2e2" stroke="#16181d" stroke-width="3"/>
      <text x="42" y="122" font-family="'Inter', sans-serif" font-size="52" font-weight="900" fill="#16181d" transform="skewY(24)">JS</text>
      <text x="70" y="180" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#e5ff00">TYPESCRIPT</text>
    </g>

    <!-- Node Badge -->
    <g transform="translate(315, 0)">
      <rect width="135" height="135" rx="30" fill="#1e2229" stroke="#38404a" stroke-width="2.5"/>
      <polygon points="67,30 102,50 102,90 67,110 32,90 32,50" fill="#21a366"/>
      <text x="67" y="80" text-anchor="middle" font-family="'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff">node</text>
      <text x="67" y="160" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#ffffff">NODE.JS</text>
    </g>
  </g>

  <!-- Accent bottom gradient line -->
  <line x1="0" y1="796" x2="540" y2="796" stroke="#e5ff00" stroke-width="8"/>
</svg>